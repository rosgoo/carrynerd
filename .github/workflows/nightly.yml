# The data plane. Runs the pipeline nightly and commits the diff — git is the
# database history, the backup and the audit log, for nothing.
#
# Two jobs because they have wildly different cost profiles:
#
#   fetch     /products.json only, ~3 requests per brand. Sharded across a
#             small matrix so the whole brand list finishes inside one run.
#   assemble  normalize, price tracking (banked immediately), an enrichment
#             batch, and the alert matcher. Single runner, single commit.
#
# The enrichment backlog drains here too, ~800 pages a night. The old premise —
# that a first pass this size belongs on a home machine with a residential IP —
# was calibrated for /products.json, which throttles datacenter ranges on
# sight. Product pages are ordinary CDN-fronted HTML: interleaved across ~84
# brands, a store sees ~10 requests a night, minutes apart, and runners get
# clean 200s. At that rate the whole backlog clears in about a week.
#
# Pushing to main is what triggers the site rebuild: Vercel's git integration
# deploys the commit. There is no deploy hook to keep in sync.

name: nightly

on:
  # 03:20 UTC. Off the hour on purpose — the top of the hour is when every other
  # cron on GitHub fires and runners queue.
  #
  # Held off until a full run had been done by hand, which was the right order.
  # Arming it on the first push would have introduced the crawler to ~160 stores
  # from a datacenter IP while Shopify was already blocking us, and then failed
  # at the gate regardless: the regenerated catalogue dropped dims 57% -> 24%,
  # volume 89% -> 49% and laptop 45% -> 9%, every one past validate.py's
  # 10-point coverage limit. Run 30973717097 settled that — the gate passed at
  # the strict default and coverage moved up rather than off the cliff — so a
  # run with no inputs now publishes cleanly, which is what a cron is.
  #
  # Nightly rather than weekly, which was open for a while. Specs never change,
  # so refetching them nightly is waste — but price and stock arrive in the same
  # request, and a weekly fetch means an alert can fire six days after a sale
  # started, which is not a late alert but a wrong one. It also turns
  # price-history.jsonl from a record of movements into weekly snapshots, and
  # discounting cadence is the licensing pitch.
  #
  # The politeness case for weekly is thinner than it reads. The feed adapters
  # spend one to three requests on an entire catalogue, so a night across 123
  # stores is roughly 250 requests; the page adapters are the expensive ones and
  # they are already capped by --limit and chunked by --max-age. Nightly is not
  # seven times the crawl, it is seven times a small number.
  schedule:
    - cron: '20 3 * * *'

  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip the crawl; assemble from the cached raw/ only"
        type: boolean
        default: false
      max_coverage_drop:
        description: "Points of coverage a field may lose before the gate fails (default 10)"
        type: string
        default: "10"
      only:
        description: "Comma-separated brand slugs to fetch, instead of the whole roster"
        type: string
        default: ""
      forget_prices:
        description: "Brand slugs whose price state to reset — for a currency or parser correction, so the fix does not read as a sale"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # Never let two nights overlap; the second would fight the first for the
  # commit and double-count price changes.
  group: nightly
  cancel-in-progress: false

env:
  # The feed pacing, and ~85% of a run's wall time — it is spacing, not data.
  # A brand costs about two of these whether it sells 40 products or 1,400.
  #
  # 65 came from the premise that datacenter IPs get `local_rate_limited` from
  # Shopify's edge almost immediately. The premise went untested until
  # 2026-08-02 and did not survive: 32 of 40 brands served a runner while this
  # project's residential IP was getting 429 on 6 of 6 stores, and no shard
  # tripped the rate-limit breaker across a full night of crawling.
  #
  # 30 halves the run, to roughly half an hour of wall time across four shards.
  # Step down further only with the fetch log watched for 429s and challenge
  # markers. The breaker stops a shard after three consecutive rate-limited
  # brands so the downside is bounded, but this is still a store's patience
  # being spent. Raise this line if the crawl starts being refused.
  DELAY: '30'
  SHARDS: '4'
  # Enrichment gets its own pacing, for the same reason the plate sampler does.
  # DELAY exists because /products.json rate-limits per client IP and throttles
  # datacenter ranges on sight. Enrichment does not touch that endpoint — it
  # fetches ordinary product pages, which are CDN-fronted HTML with nothing
  # like the same limit — so 30 was inheriting a number calibrated for a
  # different problem and paying an hour a night to read 60 pages.
  #
  # 8 is the global spacing, not what any one store feels: enrich.py
  # interleaves across every brand with work left (~84), so a single store
  # sees roughly one request per (8s × live brands) ≈ 11 minutes — politer
  # than the page adapters' sequential 5s crawl of one store. The evidence
  # for stepping down: the 30s nights ran 60/60 HTTP 200 across 60 different
  # stores. robots.txt Crawl-delay is honoured per brand on top of this, and
  # the breakers (--give-up-after, --cool-off) bound a wrong guess at one
  # night. Raise this line if the enrich log starts showing 429s.
  ENRICH_DELAY: '8'
  # And the page adapters, for the same reason a third time. They fetch one
  # product page each, not /products.json, so they were paying the feed's
  # per-IP limit for requests that never touch it. CamelBak was 124 pages:
  # 2.2 hours at the old 65s, about ten minutes at 5s. robots
  # Crawl-delay is still honoured per brand on top of this, so a host that asks
  # for ten seconds gets ten seconds regardless of what is set here.
  PAGE_DELAY: '5'
  # Live and serving a real page as of 2026-08-02. This has to keep being true:
  # fetch.py omits the contact URL entirely when unset, on purpose, because a
  # UA advertising a URL that does not resolve is the stock bot signature that
  # Bonfus's WAF 403s on sight. Pointing it somewhere dead is worse than
  # sending nothing at all.
  CARRYNERD_CONTACT: https://carrynerd.com/bot

jobs:
  fetch:
    # Skippable, because everything interesting in this workflow happens
    # afterwards. The gate, the alert matcher and both data pushes live in
    # `assemble`, and reaching them normally costs hours of crawling first —
    # which is a poor way to test forty lines of shell. assemble is
    # `if: always()` and restores raw/ from cache, so a skipped fetch still
    # assembles a real catalogue from the last crawl's data.
    if: inputs.skip_fetch != true
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Splitting the brand *list* across runners is capacity. Each shard is an
      # ordinary polite client: it paces at DELAY, honours Retry-After, and
      # never retries a block that another shard hit. Raise this as the brand
      # list grows — never in response to a 429.
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Yesterday's catalogues. --max-age refetches anything older than 20h, so
      # this is not a way to skip work; it is what lets a brand that fails
      # tonight keep its last good catalogue instead of vanishing from the
      # index for a day.
      # The `raw-` fallback that used to sit below is gone, and it is worth
      # saying why rather than leaving it to be re-added. It did what it
      # promised — the migration inherited the full catalogue instead of
      # starting empty — but it also handed every shard all 116 brands, and the
      # upload below ships whatever is on disk. Four artifacts holding the same
      # paths is what broke run 30967258125: see the prune step, which is the
      # real fix and makes the fallback safe to want again. It is still not
      # needed, because the per-shard entries now exist.
      #
      # Shard-scoped, because the shard stride is deterministic: fetch.py
      # slices brands[index::count], so shard N handles the same brands every
      # night and only ever needs its own catalogues. A cache entry restores as
      # one blob and cannot be merged, so per-shard keys are what make saving
      # per shard possible at all.
      - name: Restore raw catalogues
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: raw-s${{ matrix.shard }}-

      # --limit caps the crawl-style adapters, the way enrich is capped. The
      # feed adapters are unaffected: /products.json returns a whole catalogue
      # in one to three requests whether the brand sells 40 products or 1,400,
      # so there is nothing there to bound. The page adapters are the opposite
      # — one request per product, sharing this same 65s pacer — and uncapped
      # they do not finish. Deuter's sitemap alone lists ~1,054 product URLs,
      # which is 19 hours at this pacing against a 330-minute job limit.
      #
      # Chunked rather than truncated: --max-age means a capped run picks up
      # where the last one stopped, so a large brand fills in over several
      # nights instead of the same first N pages being refetched every time.
      - name: Fetch shard ${{ matrix.shard }}
        run: |
          python3 fetch.py \
            --shard ${{ matrix.shard }}/${{ env.SHARDS }} \
            --delay ${{ env.DELAY }} \
            --max-age 20 \
            --limit 150 \
            --cache-pages \
            --page-delay ${{ env.PAGE_DELAY }} \
            --only "${{ inputs.only }}"

      # Everything below this line copies raw/ somewhere else, so this is where
      # it has to be true that raw/ holds this shard's brands and nothing else.
      # A restored cache can be wider than the slice — a pre-split entry, a
      # roster change, the `raw-` fallback that used to be above — and assemble
      # merges the four artifacts by extracting them over each other, which
      # overwrites in place without truncating. Two shards shipping the same
      # brand at different sizes leaves a valid catalogue with stray bytes after
      # it, and normalize.py cannot read it. Disjoint artifacts remove the
      # collision rather than hoping extraction order is kind.
      #
      # if: always() for the same reason the two steps below have it: a shard
      # that was rate-limited or timed out still uploads what it restored, and
      # that is exactly the copy that would carry other shards' brands.
      - name: Keep only this shard's catalogues
        if: always()
        run: python3 fetch.py --prune-shard ${{ matrix.shard }}/${{ env.SHARDS }}

      # Banked here rather than after assemble, which is where it used to live
      # and where it kept being lost. A run cancelled before publishing, or an
      # assemble that fails, threw away hours of crawling that had already
      # succeeded — the artifacts survived but nothing reads those on a later
      # run, so the next night refetched work that was done. Saving at the end
      # of the shard means the crawl is banked the moment it exists, and
      # everything downstream is free to fail.
      #
      # This saves the shard's slice and not the whole catalogue: the restore
      # above is scoped to this shard's own key and the prune step enforces it,
      # so raw/ holds only the brands this shard fetches. Restoring the merged
      # cache here instead would put every brand on disk and then save four
      # near-copies of it, about 500 MB a run for nothing.
      #
      # The prune also repairs an entry that was banked wider than the slice —
      # every current raw-s<N>- entry is, having been saved before the fallback
      # was removed — so this heals itself in one run rather than needing the
      # keys reset.
      - name: Bank this shard's catalogues
        uses: actions/cache/save@v4
        if: always()
        with:
          path: raw
          key: raw-s${{ matrix.shard }}-${{ github.run_id }}

      - name: Bank this shard's pages
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/page-cache
          key: pages-s${{ matrix.shard }}-${{ github.run_id }}

      # if: always() because a cancelled or timed-out job otherwise skips this
      # and throws away everything it fetched. A job timeout is a cancellation,
      # so before this line a shard that ran to the 330-minute limit — exactly
      # what the uncapped page adapters caused — banked nothing at all.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-shard-${{ matrix.shard }}
          path: |
            raw/
            data/page-cache/
            data/fetch-log.part-*.json
          retention-days: 2
          if-no-files-found: warn

  assemble:
    needs: fetch
    # A dead shard must not cost us the whole night. Whatever did come back
    # gets normalized over the cached remainder.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The catalogue, the ledger and the caches. Without this the job runs
      # against an empty data/ and every step downstream misreads it: enrich.py
      # picks its batch by excluding what is already in enrich-cache.json, so
      # an absent cache means re-enriching from zero; track_prices.py compares
      # against price-state.json, so an absent one makes every price look new
      # and writes a fresh ledger over 1,500 real observations. Nothing errors
      # while any of that happens.
      - name: Pull the published data
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash scripts/data-pull.sh

      # Keep the published catalogue before normalize.py writes over it. This
      # is what validate.py compares tonight's build against — it used to read
      # `git show HEAD:data/bags.json`, which stopped existing when the
      # catalogue moved to the data repo. That failure was silent: no baseline
      # means the regression checks skip themselves and the gate passes having
      # checked nothing.
      - name: Keep the published catalogue as the gate's baseline
        run: cp data/bags.json data/bags.baseline.json

      # A distinct prefix from the shard caches. `restore-keys: raw-` would
      # happily match raw-s0- and hand this job one shard's catalogues while
      # looking like a hit — which on a skip_fetch run is a catalogue missing
      # three quarters of its brands, and the gate would be right to reject it.
      #
      # rawmerged- rather than rawall- because the newest rawall- entry is
      # damaged. The save step below has if: always(), so run 30967258125 banked
      # the merged directory as it stood when normalize.py died — 46 of 116
      # catalogues with a second document's bytes trailing the first. Restoring
      # it is not fatal now that normalize.py skips what it cannot parse, but a
      # skip_fetch run would quietly publish a catalogue missing 40% of its
      # brands, and the entry cannot be deleted or overwritten because cache
      # keys are immutable. Retiring the prefix is how you throw one away. The
      # cost is that until this run's save lands there is no merged entry, so a
      # skip_fetch run in that window has nothing to assemble from.
      - name: Restore raw catalogues
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: rawmerged-${{ github.run_id }}
          restore-keys: rawmerged-

      # The kept HTML, so --cache-pages means something on an ephemeral runner.
      # Deliberately a cache rather than a commit: it must survive between runs
      # without entering the public repo, because it holds brands' full
      # marketing copy. ~72 KB gzipped per page, so the whole 10k-product
      # corpus is roughly 725 MB against GitHub's 10 GB per-repo limit.
      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: data/page-cache
          key: pagesall-${{ github.run_id }}
          restore-keys: |
            pagesall-
            pages-

      # Shard artifacts land on top of the cached copies, so a brand only goes
      # stale if its shard failed — and then it is yesterday's data, not a hole.
      #
      # continue-on-error because this action treats "no artifacts matched" as
      # a failure, and there are two ordinary ways to reach that: a
      # skip_fetch run, which never produced any, and a night where every shard
      # died. Both should assemble from the cached raw/ rather than take the
      # whole job down — which is the same reasoning as assemble's if: always().
      # Unpacked to a staging directory, one subdirectory per artifact, rather
      # than merged straight over raw/ with merge-multiple. Both the staging and
      # the copy below matter, and neither is a style choice.
      #
      # Artifact extraction writes over an existing file in place and does not
      # truncate it. A shorter copy landing on a longer one therefore leaves the
      # tail of the longer behind, and `{...}{...` is not JSON. merge-multiple
      # made that happen between artifacts; extracting onto the restored cache
      # makes it happen against yesterday's copy, which needs only a brand that
      # shrank overnight. The prune step means the artifacts no longer collide,
      # but that is a property of what the shards upload, and this job should
      # not depend on it staying true.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: raw-shard-*
          path: shard-artifacts

      # cp is the whole point: it opens the destination truncating, so a shorter
      # catalogue replaces a longer one instead of being laid over it. Copying
      # artifact by artifact keeps that true even if two of them carry the same
      # brand again.
      #
      # Still "on top of the cached copies": a brand whose shard died keeps
      # yesterday's catalogue rather than vanishing, which is what the gate's
      # coverage check would otherwise reject the whole night for.
      - name: Land the shard artifacts on the cached catalogues
        run: |
          mkdir -p raw data/page-cache
          for a in shard-artifacts/raw-shard-*; do
            [ -d "$a" ] || continue
            echo "landing $a"
            if [ -d "$a/raw" ]; then
              cp -rf "$a/raw/." raw/
            fi
            if [ -d "$a/data/page-cache" ]; then
              cp -rf "$a/data/page-cache/." data/page-cache/
            fi
            for part in "$a"/data/fetch-log.part-*.json; do
              if [ -f "$part" ]; then cp -f "$part" data/; fi
            done
          done
          echo "raw/ holds $(ls raw/*.json 2>/dev/null | wc -l) catalogues"

      - name: Merge shard fetch logs
        run: python3 fetch.py --merge-logs

      - name: Normalize
        run: python3 normalize.py

      # Before the enrichment crawl, which is the long pole of this job now
      # that it reads hundreds of pages a night. The ledger is the one output
      # that cannot be backfilled — a crawl that hangs into the job timeout
      # must not cost the night's price observations — and track_prices.py
      # reads none of the fields enrich writes, so the order was free to
      # choose. Both rewrite bags.json in place and preserve each other's
      # fields, so the swap changes nothing downstream.
      #
      # `forget_prices` is empty on every scheduled run, which is the point: a
      # reset is a claim that our own numbers were wrong, and that is a thing a
      # person decides once, not a setting a cron carries. See the note on the
      # flag in track_prices.py — without it, correcting Db and Mismo's currency
      # mails a fake 90%-off announcement for 554 models.
      - name: Track prices
        run: |
          python3 track_prices.py \
            --events-out data/price-events.json \
            --forget "${{ inputs.forget_prices }}"

      # Banked the moment it exists, not at the end of the job. The bank step
      # at the bottom used to be the only push, which tied the ledger's fate
      # to every step between here and there — with a two-hour crawl in that
      # gap, a hang or a timeout would have discarded the one file that cannot
      # be rebuilt at any price. The final bank still lists these paths;
      # tonight's copies will simply already be in the data repo, and
      # data-push.sh is a no-op on an unchanged file.
      - name: Bank the ledger before the long crawl
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          bash scripts/data-push.sh \
            data/price-history.jsonl \
            data/price-state.json \
            data/fetch-log.json

      # Read before the crawl so the check at the bottom of the job can tell
      # "no work left" apart from "a night that silently contributed nothing".
      - name: Note the enrich cache size
        id: enrich_before
        run: |
          n=$(python3 -c "
          import json, os
          p = 'data/enrich-cache.json'
          print(len(json.load(open(p))) if os.path.exists(p) else 0)")
          echo "entries=$n" >> "$GITHUB_OUTPUT"

      # Incremental by construction: enrich.py skips anything already in
      # data/enrich-cache.json, which is committed, so a night only ever sees
      # what the backlog still owes. 800 × 8s ≈ 1h47m of a job that was using
      # 40 of its 330 minutes; each store sees ~10 of those pages, minutes
      # apart. At this rate the backlog clears in about a week, after which
      # this reads only the nightly delta of new SKUs.
      #
      # No continue-on-error, where there used to be one. Its job was to keep
      # a slow crawl from blocking the price commit; the ledger is banked
      # above, so nothing irreplaceable sits downstream any more. A throttled
      # night still exits 0 by design — the breakers abort politely and the
      # cache merge into bags.json runs regardless — so a green step does not
      # mean pages were read; the check at the bottom of the job is what says
      # that. A red step here means the script itself crashed, and then
      # bags.json never got its cache merge, which the gate would reject
      # anyway — better to stop at the honest step than at the gate.
      #
      # --cache-pages is not optional. Without it the HTML is parsed once and
      # dropped, so the next parser fix costs a re-crawl of every page — and
      # this project has already paid that once: the notes record a whole
      # enrich cache going stale because its entries predated a parser change.
      # Keeping the page means a fix costs `enrich.py --reparse` and zero
      # requests, which is the difference between a parser being cheap to
      # improve and being effectively frozen.
      #
      # The flag alone does nothing here, though: runners are ephemeral and
      # data/page-cache/ is gitignored on purpose — it holds brands' full
      # marketing copy, which the index deliberately does not reproduce and
      # which must not end up in a public repo. The cache steps below are what
      # make it survive between runs without publishing it.
      - name: Enrich new products
        run: python3 enrich.py --limit 800 --delay ${{ env.ENRICH_DELAY }} --cache-pages

      # Cached by image URL in data/image-bg.json, which is committed, so a
      # normal night samples only the photos that changed. Runs after enrich
      # because both rewrite bags.json, and allowed to fail for the same reason
      # enrich is: a plate that stays white is a cosmetic loss, and it must not
      # block the price commit.
      #
      # Deliberately NOT env.DELAY. That number is calibrated for /products.json,
      # which rate-limits per client IP and throttles datacenter ranges; this
      # stage talks to cdn.shopify.com, a static image CDN with no such limit,
      # and inheriting the feed's pacing would put a first backfill at over a
      # hundred hours and get the job killed. Half a second is still polite for
      # a CDN from a cloud host.
      #
      # --limit caps a night's work, the way enrich is capped. The apply pass
      # runs over the whole catalog from cache regardless, so plates already
      # sampled come back on the first run and a backlog fills in over a few
      # nights rather than in one long step.
      - name: Sample product-photo backgrounds
        continue-on-error: true
        run: |
          pip install --quiet -r requirements-image-bg.txt
          python3 image_bg.py --delay 0.5 --limit 1000

      # The gate. Runs before the commit, so a parser that ate half the index
      # fails the job instead of publishing and getting recrawled. Compares
      # against the last committed catalogue, which is the copy currently live.
      # A legitimate large change — a merge fix, a stricter classifier — needs
      # a one-off --max-drop and a human deciding it is right.
      # --require-baseline because here a missing baseline can only mean the
      # pull failed. Skipping the regression checks is the right call on a
      # genuine first run and exactly the wrong one in a pipeline that fetches
      # its own baseline: the gate would report success having compared nothing.
      # max_coverage_drop is an input rather than a setting, and defaults to the
      # strict value, because widening the catalogue is a decision somebody
      # makes once and not a permanent loosening of the gate. A scheduled run
      # gets no inputs and so gets 10 — which is the point: an unattended night
      # can never publish a large coverage regression on its own.
      - name: Validate
        run: |
          python3 validate.py \
            --baseline data/bags.baseline.json \
            --require-baseline \
            --max-coverage-drop ${{ inputs.max_coverage_drop || '10' }}

      - name: Install alert matcher dependencies
        run: pip install --quiet -r alerts/requirements.txt

      # Runs here rather than on its own schedule because track_prices.py has
      # just worked out exactly which prices moved. A separate cron would have
      # to re-derive that from the ledger by timestamp comparison.
      # Exits cleanly when DATABASE_URL is unset, so this stays green until
      # the database is wired up.
      - name: Match price alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 alerts/match.py --events data/price-events.json

      - name: Save raw catalogues
        uses: actions/cache/save@v4
        # The merged set, after the shard artifacts have landed on top of it.
        # The shards bank their own slices during fetch; this is what a
        # skip_fetch run restores, and the only place the whole catalogue
        # exists in one entry. Cache keys are immutable, so this only ever
        # writes a fresh run-id key — which is also why a bad merge cannot be
        # repaired in place and the prefix had to be retired once already.
        if: always()
        with:
          path: raw
          key: rawmerged-${{ github.run_id }}

      # Same reasoning, and if: always() for the same reason as the artifact
      # upload: a night that fails the gate has still paid for these pages, and
      # dropping them means paying again.
      - name: Save page cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/page-cache
          key: pagesall-${{ github.run_id }}

      # Memory and the ledger, banked whatever the gate decided.
      #
      # if: always(), so a failed gate above cannot discard it. enrich.py
      # chooses its next batch by excluding
      # everything already in enrich-cache.json, so gating that file behind
      # validate.py means a rejected night throws away its own progress and the
      # next run re-enriches the identical 60 products — the crawl never
      # advances, however many nights it runs. The ledger is worse: a night's
      # price observations cannot be recovered later at any price.
      #
      # No deploy hook here; the script only fires it when the catalogue is in
      # the push, and the catalogue deliberately is not.
      - name: Bank the ledger and caches
        if: always()
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          bash scripts/data-push.sh \
            data/price-history.jsonl \
            data/price-state.json \
            data/enrich-cache.json \
            data/image-bg.json \
            data/fetch-log.json \
            data/collections

      # The catalogue, only once it has validated. This is the publishing step:
      # the site builds from the data repo, so pushing bags.json and firing the
      # hook is what puts a change in front of readers. Everything the gate is
      # for applies here and only here.
      - name: Publish the catalogue
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: bash scripts/data-push.sh data/bags.json

      # The silent-zero check. A fully throttled crawl exits 0 by design —
      # the breakers stop it politely — which at 60 pages a night was a cheap
      # loss and at 800 is a lost day of the backlog week. Last on purpose: by
      # the time this can fire, the ledger is banked, alerts are matched and
      # the catalogue is published, so going red costs the night nothing — it
      # is purely a signal. Zero growth with zero backlog is the crawl being
      # finished, not a failure; robots-disallowed pages are cached entries,
      # so a store that refuses us still counts as the backlog shrinking.
      - name: Fail loudly if the crawl moved nothing
        env:
          ENRICH_BEFORE: ${{ steps.enrich_before.outputs.entries }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from enrich import enrichable
          before = int(os.environ["ENRICH_BEFORE"])
          cache = (json.load(open("data/enrich-cache.json"))
                   if os.path.exists("data/enrich-cache.json") else {})
          bags = json.load(open("data/bags.json"))["bags"]
          backlog = [b for b in bags
                     if b["id"] not in cache and enrichable(b)
                     and (b.get("dims_cm") is None
                          or b.get("laptop_in") is None)]
          grew = len(cache) - before
          line = f"enrich: +{grew} pages tonight, {len(backlog)} still queued"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(line + "\n")
          if grew == 0 and backlog:
              print(f"::error::enrichment contributed nothing tonight with "
                    f"{len(backlog)} products still queued — read the enrich "
                    f"step's log for 429s or challenge markers")
              sys.exit(1)
          PY

  # The other half of the freshness story, and the slow half.
  #
  # validate.py gates the cliff: it compares tonight's catalogue against the
  # last published one and stops the deploy when a brand falls off it. What no
  # night-over-night check can see is a brand shedding a few percent a night —
  # each step is small, and each night's baseline is the previous night's
  # already-diminished count, so the decline never trips anything and the
  # baseline follows it all the way down. Three percent a night is 46% gone in
  # three weeks. Seeing that needs the whole series, which is exactly what the
  # data repo has been accruing in fetch-log.json's commit history and nothing
  # could read.
  #
  # Its own job rather than a step in assemble, for two reasons: it must run
  # after the bank step has pushed tonight's fetch log, and it must not be able
  # to fail the nightly. A slow signal that can turn a build red is a slow
  # signal that gets muted, so this reports and never blocks.
  history:
    needs: assemble
    # The bank step is `if: always()` too. A night the gate rejected is a night
    # the crawl-reliability view is *more* worth having, not less.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Clones the data repo itself, at full depth — the history is the input
      # here, so the --depth 1 that data-pull.sh uses would defeat the purpose.
      # Stdlib only, like the crawl: the obvious tool for this is git-history,
      # and its current release silently returns an empty database for any file
      # that is not at the repo root. See the module docstring.
      - name: Build the crawl history
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python3 scripts/crawl_history.py --out crawl-history.db

      # Derived entirely from commits that are already in the data repo, so it
      # is rebuildable at any time and deliberately not committed anywhere: a
      # binary blob that git cannot delta, rewritten nightly, would cost more
      # storage than the history it summarises. The artifact is a convenience
      # for querying without a clone.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-history
          path: crawl-history.db
          retention-days: 14
          if-no-files-found: warn
